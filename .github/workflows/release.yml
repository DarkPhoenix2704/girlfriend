name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: girlfriend-linux-x64
            npm_pkg: gf-uwu-linux-x64
          - runner: macos-latest
            artifact: girlfriend-darwin-arm64
            npm_pkg: gf-uwu-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: |
          bun build index.ts \
            --compile \
            --outfile dist/${{ matrix.artifact }}

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign binary
        run: |
          gpg --batch --yes \
            --detach-sign \
            --armor \
            dist/${{ matrix.artifact }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.asc

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            install.sh
            npm
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum girlfriend-* | tee SHA256SUMS

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign checksums
        run: |
          gpg --batch --yes \
            --detach-sign \
            --armor \
            dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/girlfriend-linux-x64
            dist/girlfriend-linux-x64.asc
            dist/girlfriend-darwin-arm64
            dist/girlfriend-darwin-arm64.asc
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
            install.sh

      - name: Set version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Publish gf-uwu-linux-x64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cp dist/girlfriend-linux-x64 npm/packages/gf-uwu-linux-x64/bin/girlfriend
          chmod +x npm/packages/gf-uwu-linux-x64/bin/girlfriend
          cd npm/packages/gf-uwu-linux-x64
          npm version "$VERSION" --no-git-tag-version
          npm publish --access public

      - name: Publish gf-uwu-darwin-arm64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cp dist/girlfriend-darwin-arm64 npm/packages/gf-uwu-darwin-arm64/bin/girlfriend
          chmod +x npm/packages/gf-uwu-darwin-arm64/bin/girlfriend
          cd npm/packages/gf-uwu-darwin-arm64
          npm version "$VERSION" --no-git-tag-version
          npm publish --access public

      - name: Publish gf-uwu
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm
          # Pin optionalDependencies to the exact release version
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.optionalDependencies['gf-uwu-linux-x64'] = process.env.VERSION;
            pkg.optionalDependencies['gf-uwu-darwin-arm64'] = process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          npm version "$VERSION" --no-git-tag-version
          npm publish --access public
